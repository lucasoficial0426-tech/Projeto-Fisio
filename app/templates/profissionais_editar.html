{% extends "base.html" %}
{% block title %}Editar Profissional - Projeto Sessão{% endblock %}
{% block content %}

<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h1><i data-feather="user"></i> Editar Profissional</h1>
                <a href="{{ url_for('listar_profissionais') }}" class="btn btn-secondary">
                    <i data-feather="arrow-left"></i> Voltar
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('editar_profissional', profissional_id=profissional.id) }}">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo *</label>
                            <input type="text" class="form-control" id="nome" name="nome" required 
                                   placeholder="Digite o nome completo" value="{{ profissional.nome }}">
                        </div>

                        <div class="mb-3">
                            <label for="cpf" class="form-label">CPF *</label>
                            <input type="text" class="form-control" id="cpf" name="cpf" required 
                                   placeholder="000.000.000-00" maxlength="14" value="{{ profissional.cpf }}">
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo *</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="" disabled>Selecione o tipo</option>
                                <option value="Sócio" {% if profissional.tipo == 'Sócio' %}selected{% endif %}>Sócio</option>
                                <option value="Contratado" {% if profissional.tipo == 'Contratado' %}selected{% endif %}>Contratado</option>
                                <option value="Contratada" {% if profissional.tipo == 'Contratada' %}selected{% endif %}>Contratada</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('listar_profissionais') }}" class="btn btn-secondary">
                                <i data-feather="x"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i data-feather="check"></i> Salvar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
