{% extends "base.html" %}
{% block title %}Cadastrar Paciente - Projeto Sessão{% endblock %}
{% block content %}

<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h1><i data-feather="user-plus"></i> Cadastrar Paciente</h1>
                <a href="{{ url_for('listar_pacientes') }}" class="btn btn-secondary">
                    <i data-feather="arrow-left"></i> Voltar
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('cadastro_paciente') }}">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo *</label>
                            <input type="text" class="form-control" id="nome" name="nome" required 
                                   placeholder="Digite o nome completo">
                        </div>

                        <div class="mb-3">
                            <label for="cpf" class="form-label">CPF *</label>
                            <input type="text" class="form-control" id="cpf" name="cpf" required 
                                   placeholder="000.000.000-00" maxlength="14">
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo *</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="" selected disabled>Selecione o tipo</option>
                                <option value="Particular">Particular</option>
                                <option value="Convênio">Convênio</option>
                            </select>
                        </div>

                        <div class="mb-3" id="convenio-group" style="display: none;">
                            <label for="convenio" class="form-label">Convênio</label>
                            <select class="form-select" id="convenio" name="convenio">
                                <option value="" selected disabled>Selecione o convênio</option>
                                {% for convenio in convenios %}
                                <option value="{{ convenio }}">{{ convenio }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('listar_pacientes') }}" class="btn btn-secondary">
                                <i data-feather="x"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i data-feather="check"></i> Salvar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Mostrar/Ocultar campo de convênio com base no tipo
const tipoSelect = document.getElementById('tipo');
const convenioGroup = document.getElementById('convenio-group');

tipoSelect.addEventListener('change', function() {
    if (this.value === 'Convênio') {
        convenioGroup.style.display = 'block';
    } else {
        convenioGroup.style.display = 'none';
    }
});
</script>

{% endblock %}
